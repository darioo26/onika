<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onika - Login</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0a192f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(100, 255, 218, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(100, 255, 218, 0.1) 0%, transparent 20%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: linear-gradient(45deg, transparent 49%, rgba(100, 255, 218, 0.1) 50%, transparent 51%);
            animation: glitch 10s linear infinite;
            z-index: -1;
        }

        @keyframes glitch {
            0% { transform: translateX(-25%) translateY(0); }
            100% { transform: translateX(0) translateY(-25%); }
        }

        .login-container {
            background: rgba(17, 34, 64, 0.85);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(100, 255, 218, 0.2);
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 255, 218, 0.3);
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .logo img {
            width: 60px;
            height: 60px;
            margin-right: 15px;
            filter: drop-shadow(0 0 8px rgba(100, 255, 218, 0.6));
        }

        .logo-text {
            font-size: 38px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(to right, #64ffda, #00a3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(100, 255, 218, 0.4);
            letter-spacing: 2px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Orbitron', sans-serif;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            background: rgba(13, 25, 48, 0.5);
            border-radius: 10px;
            padding: 4px;
            position: relative;
            overflow: hidden;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .tab.active {
            color: #112240;
        }

        .tab-slider {
            position: absolute;
            height: 36px;
            background: #64ffda;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.17, 0.67, 0.5, 1.25);
            top: 4px;
            left: 4px;
            width: calc(50% - 4px);
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.5);
        }

        .form-container {
            margin-top: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: #64ffda;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(8, 15, 30, 0.6);
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 8px;
            box-sizing: border-box;
            color: white;
            font-family: 'Roboto', sans-serif;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        input:focus, select:focus {
            outline: none;
            border-color: #64ffda;
            box-shadow: 0 0 0 2px rgba(100, 255, 218, 0.3);
        }

        .error-message {
            color: #ff4d4d;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #64ffda;
            color: #112240;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.5s ease;
        }

        button:hover {
            background: #52d3ba;
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.5);
            transform: translateY(-2px);
        }

        button:hover::before {
            left: 100%;
        }

        .register-link {
            text-align: center;
            margin-top: 15px;
        }

        .register-link a {
            color: #64ffda;
            text-decoration: none;
        }

        #register-form {
            display: none;
        }

        .success-message {
            color: #64ffda;
            text-align: center;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: rgba(100, 255, 218, 0.1);
            border-radius: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(100, 255, 218, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(100, 255, 218, 0); }
            100% { box-shadow: 0 0 0 0 rgba(100, 255, 218, 0); }
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(100, 255, 218, 0.3);
        }

        .divider span {
            padding: 0 10px;
            color: rgba(255, 255, 255, 0.7);
        }

        .google-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 12px;
            background: white;
            color: #444;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .google-btn img {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }
        
        /* Improved styling for Google Sign In button */
        .google-signin-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 14px;
            background: white;
            color: #444;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-top: 15px;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        .google-signin-button:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            background-color: #f7f7f7;
            transform: translateY(-2px);
        }
        
        .google-signin-button img {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

        /* Back button styling */
        .back-button {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(100, 255, 218, 0.2);
            color: #64ffda;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(100, 255, 218, 0.3);
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.2);
            z-index: 10;
        }

        .back-button:hover {
            background: rgba(100, 255, 218, 0.3);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.4);
        }

        .back-arrow {
            width: 10px;
            height: 10px;
            border-left: 2px solid #64ffda;
            border-bottom: 2px solid #64ffda;
            transform: rotate(45deg);
            margin-left: 3px;
        }

        /* Futuristic elements */
        .scanner-line {
            position: absolute;
            height: 2px;
            width: 100%;
            background: linear-gradient(90deg, transparent, #64ffda, transparent);
            top: 0;
            animation: scan 4s infinite;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Corners decoration */
        .corner {
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid #64ffda;
            opacity: 0.7;
        }

        .corner-tl {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }

        .corner-tr {
            top: -2px;
            right: -2px;
            border-left: none;
            border-bottom: none;
        }

        .corner-bl {
            bottom: -2px;
            left: -2px;
            border-right: none;
            border-top: none;
        }

        .corner-br {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Back button -->
        <a href="index.html" class="back-button">
            <div class="back-arrow"></div>
        </a>
        
        <!-- Futuristic elements -->
        <div class="scanner-line"></div>
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        
        <div class="logo">
            <img src="wolf-logo.png" alt="Logo Serigala">
            <span class="logo-text">Onika</span>
        </div>
        
        <div class="tabs">
            <div class="tab-slider"></div>
            <div class="tab active" onclick="showTab('login')">Login</div>
            <div class="tab" onclick="showTab('register')">Register</div>
        </div>
        
        <div id="login-form" class="form-container">
            <form id="login-form-element" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                
                <div id="login-error" class="error-message"></div>
                
                <button type="submit">Login</button>
            </form>
            
            <div class="divider">
                <span>atau</span>
            </div>
            
            <div id="g_id_onload"
                data-client_id="17309466863-q3lps7r05movloqf9hmmn6g7mlrfm6ng.apps.googleusercontent.com"
                data-context="signin"
                data-callback="handleGoogleSignIn"
                data-auto_prompt="false">
            </div>
            
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
            
            <!-- Fallback button in case Google button doesn't load -->
            <button onclick="signInWithGoogle()" class="google-signin-button" id="custom-google-btn" style="display: none;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
                Sign in with Google
            </button>
        </div>
        
        <div id="register-form" class="form-container">
            <form id="register-form-element" onsubmit="return handleRegister(event)">
                <div class="form-group">
                    <label for="reg-name">Nama Lengkap</label>
                    <input type="text" id="reg-name" required>
                    <div id="name-error" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" required>
                    <div id="username-error" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required>
                    <div id="password-error" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="reg-whatsapp">Nomor WhatsApp</label>
                    <input type="text" id="reg-whatsapp" required placeholder="628xxxxxxxxxx">
                    <div id="whatsapp-error" class="error-message"></div>
                </div>
                
                <div id="register-error" class="error-message"></div>
                <div id="register-success" class="success-message">Registrasi berhasil! Silakan login.</div>
                
                <button type="submit">Register</button>
            </form>
        </div>
    </div>
    
    <script>
        function showTab(tabName) {
            // Reset error messages
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });
            
            document.getElementById('register-success').style.display = 'none';
            
            // Toggle active tab
            document.querySelectorAll('.tab').forEach((tab, index) => {
                tab.classList.remove('active');
            });
            
            if (tabName === 'login') {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.querySelector('.tab-slider').style.left = '4px';
            } else {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.querySelector('.tab-slider').style.left = 'calc(50% + 0px)';
            }
        }
        
        function validateName(name) {
            // Must be proper case (can have multiple words)
            // Only a-z and spaces
            const nameRegex = /^[A-Z][a-z]*(\s[A-Z][a-z]*)*$/;
            return nameRegex.test(name);
        }
        
        function validateUsername(username) {
            // Only a-z, 0-9, no spaces
            const usernameRegex = /^[a-z0-9]+$/;
            return usernameRegex.test(username);
        }
        
        function validatePassword(password) {
            // 6-20 characters, at least one uppercase, one lowercase, one number
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,20}$/;
            return passwordRegex.test(password);
        }
        
        function validateWhatsapp(whatsapp) {
            // Must start with 628, only numbers, 11-14 characters
            const whatsappRegex = /^628\d{8,11}$/;
            return whatsappRegex.test(whatsapp);
        }
        
        function handleRegister(event) {
            event.preventDefault();
            
            // Reset all error messages
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });
            
            document.getElementById('register-success').style.display = 'none';
            
            const name = document.getElementById('reg-name').value;
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const whatsapp = document.getElementById('reg-whatsapp').value;
            
            let isValid = true;
            
            // Validate name
            if (!validateName(name)) {
                document.getElementById('name-error').textContent = 'Nama harus dalam format Proper Case, hanya huruf a-z dan spasi.';
                document.getElementById('name-error').style.display = 'block';
                isValid = false;
            }
            
            // Validate username
            if (!validateUsername(username)) {
                document.getElementById('username-error').textContent = 'Username hanya boleh berisi huruf a-z dan angka 0-9, tidak boleh ada spasi.';
                document.getElementById('username-error').style.display = 'block';
                isValid = false;
            }
            
            // Validate password
            if (!validatePassword(password)) {
                document.getElementById('password-error').textContent = 'Password harus 6-20 karakter, mengandung minimal satu huruf besar, satu huruf kecil, dan satu angka.';
                document.getElementById('password-error').style.display = 'block';
                isValid = false;
            }
            
            // Validate whatsapp
            if (!validateWhatsapp(whatsapp)) {
                document.getElementById('whatsapp-error').textContent = 'Nomor WhatsApp harus diawali dengan 628... dan berisi 11-14 digit angka.';
                document.getElementById('whatsapp-error').style.display = 'block';
                isValid = false;
            }
            
            if (isValid) {
                // Get existing users or create empty array
                const users = JSON.parse(localStorage.getItem('users')) || [];
                
                // Check if username already exists
                if (users.some(user => user.username === username)) {
                    document.getElementById('register-error').textContent = 'Username sudah digunakan!';
                    document.getElementById('register-error').style.display = 'block';
                    return false;
                }
                
                // Add new user
                const newUser = {
                    name,
                    username,
                    password,
                    whatsapp,
                    role: 'customer' // Default role for registration is customer
                };
                
                users.push(newUser);
                
                // Save to localStorage
                localStorage.setItem('users', JSON.stringify(users));
                
                // Show success message
                document.getElementById('register-success').style.display = 'block';
                
                // Reset form
                document.getElementById('register-form-element').reset();
                
                // Switch to login tab after 2 seconds
                setTimeout(() => {
                    showTab('login');
                }, 2000);
            }
            
            return false;
        }
        
        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Get users from localStorage
            const users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Find user with matching username and password
            const user = users.find(u => u.username === username && u.password === password);
            
            if (!user) {
                document.getElementById('login-error').textContent = 'Username atau password salah!';
                document.getElementById('login-error').style.display = 'block';
                return false;
            }
            
            // Store logged in user in session storage
            sessionStorage.setItem('currentUser', JSON.stringify(user));
            
            // Redirect based on user role
            redirectBasedOnRole(user.role);
            
            return false;
        }
        
        function redirectBasedOnRole(role) {
            switch(role) {
                case 'admin':
                    window.location.href = 'admin.html';
                    break;
                case 'cashier':
                    window.location.href = 'kasir.html';
                    break;
                case 'customer':
                default:
                    window.location.href = 'index.html';
            }
        }
        
        // Handle Google Sign In
        function handleGoogleSignIn(response) {
            try {
                // Decode the JWT token to get user info
                const responsePayload = decodeJwtResponse(response.credential);
                
                // Get existing users
                const users = JSON.parse(localStorage.getItem('users')) || [];
                
                // Check if user already exists by email
                let user = users.find(u => u.email === responsePayload.email);
                
                if (!user) {
                    // Create a new user if not exists
                    user = {
                        name: responsePayload.name,
                        username: responsePayload.email.split('@')[0],
                        email: responsePayload.email,
                        googleId: responsePayload.sub,
                        picture: responsePayload.picture,
                        role: 'customer' // Google login users are customers by default
                    };
                    
                    users.push(user);
                    localStorage.setItem('users', JSON.stringify(users));
                }
                
                // Store logged in user in session storage
                sessionStorage.setItem('currentUser', JSON.stringify(user));
                
                // Redirect based on user role
                redirectBasedOnRole(user.role);
                
            } catch (error) {
                console.error("Google sign-in error:", error);
                document.getElementById('login-error').textContent = 'Gagal login dengan Google. Silakan coba lagi.';
                document.getElementById('login-error').style.display = 'block';
            }
        }
        
        // Fallback Google Sign In function
        function signInWithGoogle() {
            document.getElementById('login-error').textContent = 'Silakan gunakan tombol Google Sign-In yang resmi di atas.';
            document.getElementById('login-error').style.display = 'block';
        }
        
        // Decode the JWT token from Google
        function decodeJwtResponse(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (error) {
                console.error("Error decoding JWT:", error);
                throw new Error("Failed to decode JWT token");
            }
        }
        
        // Initialize with some users if they don't exist
        function initUsers() {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            
            if (users.length === 0) {
                // Add default admin and cashier
                const defaultUsers = [
                    {
                        name: 'Admin System',
                        username: 'admin',
                        password: 'Admin123',
                        whatsapp: '6281234567890',
                        role: 'admin'
                    },
                    {
                        name: 'Kasir Toko',
                        username: 'kasir',
                        password: 'Kasir123',
                        whatsapp: '6289876543210',
                        role: 'cashier'
                    }
                ];
                
                localStorage.setItem('users', JSON.stringify(defaultUsers));
            }
        }
        
        // Check if logged in user should already be redirected
        function checkLoggedIn() {
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
            
            if (currentUser) {
                // Redirect based on user role
                redirectBasedOnRole(currentUser.role);
            }
        }
        
        // Check if Google button loaded properly
        function checkGoogleButton() {
            setTimeout(() => {
                const googleButtonContainer = document.querySelector('.g_id_signin');
                const googleButtonRendered = googleButtonContainer && googleButtonContainer.querySelector('div[role="button"]');
                
                if (!googleButtonRendered) {
                    // Show fallback button if Google button didn't load
                    document.getElementById('custom-google-btn').style.display = 'flex';
                }
            }, 2000); // Wait 2 seconds before checking
        }
        
        // Run on page load
        window.onload = function() {
            initUsers();
            checkLoggedIn();
            checkGoogleButton();
        };
    </script>
</body>
</html>
